server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── SPA fallback ─────────────────────────────────────────────────────────
    # All non-asset requests serve index.html so React Router handles routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── SSE endpoint — disable buffering so events reach the browser live ────
    # Must come before the general /api/ block (more specific path wins).
    location = /api/events {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;

        # Required for SSE: no buffering, no caching, keep connection open
        proxy_set_header   Connection          '';
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 600s;   # keep SSE connections alive for up to 10 min
        chunked_transfer_encoding on;

        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
    }

    # ── General API proxy ─────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;

        # Allow large request bodies (e.g. long email previews)
        client_max_body_size 4m;
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy       "strict-origin" always;

    # ── Static asset caching ──────────────────────────────────────────────────
    location ~* \.(js|css|woff2?|ttf|svg|ico|png|jpg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
